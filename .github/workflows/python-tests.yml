name: Run Automated Tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:
    inputs:
      test_mark:
        description: 'Test marker (e.g. functional, smoke)'
        required: false
        default: 'all'

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        if [ "${{ github.event.inputs.test_mark }}" = "all" ]; then
          pytest -v --maxfail=2 --disable-warnings
        else
          pytest -v -m ${{ github.event.inputs.test_mark }} --maxfail=2 --disable-warnings
        fi
