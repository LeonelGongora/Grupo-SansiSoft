name: Run Automated Tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:
    inputs:
      test_mark:
        description: 'Test marker (e.g. functional, smoke)'
        required: false
        default: 'all'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      REDDIT_ACCESS_TOKEN_CADUCADO: ${{ secrets.REDDIT_ACCESS_TOKEN_CADUCADO }}
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
            MARK="${{ github.event.inputs.test_mark || 'all' }}"
            if [ "$MARK" = "all" ]; then
            pytest -v --maxfail=2 --disable-warnings || true
            else
            pytest -v -m "$MARK" --maxfail=2 --disable-warnings || true
            fi

