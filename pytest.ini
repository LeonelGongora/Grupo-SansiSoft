[pytest]
pythonpath = .
markers = 
    smoke: mark test as smoke to run it in the smoke test suite
    regression: mark test as regression to run it in the regression test suite
    sanity: mark test as sanity to run it in the sanity test suite
    critical: mark test as critical to run it in the critical test suite
    slow: mark test as slow to run it in the slow test suite
    fast: mark test as fast to run it in the fast test suite
    ui: mark test as ui to run it in the UI test suite